<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local RAG</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
      --user: #243044;
      --bot: #16202e;
      --split-border: #2a3544;
      --canvas: #2b2d39;
      --graph-panel: #25262e;
      --graph-muted: #9aa0ae;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0; min-height: 100%; height: 100%;
      font-family: system-ui, Segoe UI, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
    }
    header.app-header {
      flex-shrink: 0;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--split-border);
      background: var(--panel);
    }
    .app-header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem 1rem;
    }
    .app-header-brand { min-width: 0; flex: 1 1 14rem; }
    .app-header-brand h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
    .app-header-tagline {
      margin: 0.2rem 0 0;
      font-size: 0.78rem;
      color: var(--muted);
      max-width: 40rem;
      line-height: 1.4;
    }
    .app-header-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .btn-tool {
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #243044;
      color: var(--text);
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .btn-tool:hover { background: #2d3d54; border-color: #3d536d; }
    .btn-tool-primary {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }
    .btn-tool-primary:hover { filter: brightness(1.06); }
    .btn-tool:disabled { opacity: 0.55; cursor: not-allowed; }
    .tool-status {
      font-size: 0.72rem;
      color: var(--muted);
      max-width: 20rem;
      line-height: 1.35;
    }
    .tool-status.ok { color: #86efac; }
    .tool-status.err { color: #f87171; }
    .tool-status.run { color: #fcd34d; }
    .vault-files-panel { margin-top: 0.65rem; padding-top: 0.65rem; border-top: 1px solid var(--split-border); }
    .vault-files-panel.is-collapsed { display: none; }
    .vault-files-panel-inner { display: flex; flex-direction: column; gap: 0.45rem; max-height: min(36vh, 280px); }
    .vault-files-heading { font-size: 0.78rem; font-weight: 600; color: var(--text); }
    .vault-files-meta { font-size: 0.72rem; color: var(--muted); }
    .vault-files-list {
      margin: 0;
      padding: 0 0 0 1.1rem;
      overflow-y: auto;
      font-size: 0.78rem;
      color: #c8cdd8;
      line-height: 1.55;
    }
    .vault-files-list li { word-break: break-all; }

    #split {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: row;
      align-items: stretch;
    }
    #chat-panel {
      flex: 0 1 44%;
      max-width: 640px;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--split-border);
    }
    #graph-panel {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--canvas);
    }
    #chat {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 0.85rem 1rem;
    }
    .msg {
      margin-bottom: 0.85rem; padding: 0.65rem 0.85rem; border-radius: 10px;
      max-width: 98%; white-space: pre-wrap; line-height: 1.45; font-size: 0.92rem;
    }
    .msg.user { background: var(--user); margin-left: auto; }
    .msg.bot { background: var(--bot); border: 1px solid #2a3544; }
    .sources {
      font-size: 0.72rem; color: var(--muted); margin-bottom: 0.45rem;
      padding: 0.45rem 0.65rem; background: #121a24; border-radius: 8px;
      border: 1px dashed #334155;
    }
    #bar {
      flex-shrink: 0;
      padding: 0.65rem 1rem;
      border-top: 1px solid var(--split-border);
      background: var(--panel);
      display: flex; gap: 0.45rem; flex-wrap: wrap; align-items: center;
    }
    #inp {
      flex: 1; min-width: 140px; padding: 0.55rem 0.75rem;
      border-radius: 8px; border: 1px solid #334155;
      background: #0f1419; color: var(--text); font-size: 0.95rem;
    }
    button {
      padding: 0.55rem 0.95rem; border-radius: 8px; border: none;
      background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; font-size: 0.9rem;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    label { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 0.3rem; }
    .typing { color: var(--muted); font-size: 0.78rem; margin-top: 0.2rem; }
    .err { color: #f87171; font-size: 0.85rem; }

    .rag-tools {
      flex-shrink: 0;
      padding: 0.5rem 1rem 0;
      border-top: 1px solid var(--split-border);
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.75rem;
    }
    .rag-tools label { display: inline-flex; align-items: center; gap: 0.25rem; margin: 0; }
    .rag-tools select, .rag-tools input[type="text"] {
      background: #0f1419;
      border: 1px solid #334155;
      color: var(--text);
      border-radius: 6px;
      padding: 0.25rem 0.4rem;
      font-size: 0.78rem;
      max-width: 14rem;
    }
    .vault-edit-panel {
      margin-top: 0.5rem;
      padding: 0.5rem 0.65rem;
      background: #121a24;
      border: 1px dashed #334155;
      border-radius: 8px;
      font-size: 0.78rem;
    }
    .vault-edit-panel pre {
      margin: 0.35rem 0 0;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 12rem;
      overflow: auto;
    }

    #graph-hint {
      flex-shrink: 0;
      padding: 0.35rem 0.75rem;
      font-size: 0.72rem;
      color: var(--graph-muted);
      background: var(--graph-panel);
      border-bottom: 1px solid #3d3f4c;
    }
    #graph-hint.err { color: #f0a8a8; }
    #graph-root {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: var(--canvas);
    }

    @media (max-width: 880px) {
      #split { flex-direction: column; }
      #chat-panel {
        max-width: none;
        flex: 0 0 auto;
        max-height: 52vh;
        border-right: none;
        border-bottom: 1px solid var(--split-border);
      }
      #graph-panel { flex: 1; min-height: 240px; }
    }
  </style>
  <script src="https://unpkg.com/three@0.162.0/build/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="app-header-top">
      <div class="app-header-brand">
        <h1>Local RAG</h1>
        <p class="app-header-tagline">Chat on the left, 3D vault graph on the right; retrieved notes pulse on the graph (amber) during each answer.</p>
      </div>
      <div class="app-header-tools">
        <input type="file" id="vault-file-input" class="sr-only" accept=".md,.markdown,text/markdown" multiple />
        <button type="button" class="btn-tool" id="btn-new-chat" title="Start a fresh conversation (new session)">New chat</button>
        <button type="button" class="btn-tool" id="btn-upload-md" title="Upload .md files into the vault folder">Upload .md</button>
        <button type="button" class="btn-tool btn-tool-primary" id="btn-reindex" title="Rebuild the vector index from all vault Markdown">Reindex</button>
        <span class="tool-status" id="reindex-status" role="status" aria-live="polite"></span>
        <button type="button" class="btn-tool" id="btn-vault-toggle" aria-expanded="false" aria-controls="vault-files-panel" title="Show Markdown files in the vault">Vault files</button>
      </div>
    </div>
    <div id="vault-files-panel" class="vault-files-panel is-collapsed">
      <div class="vault-files-panel-inner">
        <span class="vault-files-heading">Markdown files in vault</span>
        <span class="vault-files-meta" id="vault-files-meta"></span>
        <ul class="vault-files-list" id="vault-files-list"></ul>
      </div>
    </div>
  </header>

  <div id="split">
    <section id="chat-panel">
      <div id="chat"></div>
      <div id="rag-tools" class="rag-tools">
        <label>Note filter <select id="filter-note" title="Restrict search to one .md file"><option value="">(all notes)</option></select></label>
        <label>Tag <input type="text" id="filter-tag" placeholder="substring" maxlength="128" title="Match YAML tags field" /></label>
        <label><input type="checkbox" id="expand-wikilinks" checked /> Wikilink +1 hop</label>
        <label><input type="checkbox" id="suggest-edit" /> Suggest vault edit</label>
        <button type="button" class="btn-tool" id="btn-export-chat" title="Save transcript to vault/Chat exports/">Export chat</button>
      </div>
      <div id="bar">
        <input id="inp" type="text" placeholder="Ask something..." autocomplete="off" />
        <label><input type="checkbox" id="sources" /> Show sources</label>
        <button id="send" type="button">Send</button>
      </div>
    </section>
    <section id="graph-panel">
      <div id="graph-hint">Loading graph...</div>
      <div id="graph-root"></div>
    </section>
  </div>

  <!-- Fetches /api/vault/graph for the 3D graph; streams answers via POST /api/rag/stream (SSE). -->
  <script>
(function () {
  // --- Layout: chat (SSE) + ForceGraph3D; amber pulse uses ids from the first SSE "sources" event ---
  const NODE = '#aeb8ff';
  const LINK = '#5c6074';
  const PULSE = '#ffc107';
  /** Active note-filter selection (matches vault_rel_path / graph node id). */
  const FILTER_NODE = '#ef4444';

  const chat = document.getElementById('chat');
  const inp = document.getElementById('inp');
  const send = document.getElementById('send');
  const showSources = document.getElementById('sources');
  const graphHint = document.getElementById('graph-hint');
  const graphRoot = document.getElementById('graph-root');
  const vaultFileInput = document.getElementById('vault-file-input');
  const btnUploadMd = document.getElementById('btn-upload-md');
  const btnReindex = document.getElementById('btn-reindex');
  const reindexStatus = document.getElementById('reindex-status');
  const filterNote = document.getElementById('filter-note');
  const filterTag = document.getElementById('filter-tag');
  const expandWikilinks = document.getElementById('expand-wikilinks');
  const suggestEdit = document.getElementById('suggest-edit');
  const btnExportChat = document.getElementById('btn-export-chat');

  const btnNewChat = document.getElementById('btn-new-chat');
  const btnVaultToggle = document.getElementById('btn-vault-toggle');
  const vaultFilesPanel = document.getElementById('vault-files-panel');
  const vaultFilesList = document.getElementById('vault-files-list');
  const vaultFilesMeta = document.getElementById('vault-files-meta');

  let graph3d = null;
  /** @type {{ nodes: object[], links: object[] } | null} */
  let graphModel = null;
  let pulseTimer = null;
  let pulsePhase = false;
  let pulsingIds = new Set();
  let pendingPulseItems = null;
  let graphResizeObserver = null;
  let graphListenersAttached = false;
  var graphResizeRafGlobal = null;
  /** Resolved graph node id for the Note filter (red sphere); null = all notes. */
  var filterGraphNodeId = null;

  /** Persisted server session (SQLite); next requests send this id for dialog + RAG context. */
  var SESSION_KEY = 'rag_chat_session_id';

  async function loadPersistedChat() {
    var sid = localStorage.getItem(SESSION_KEY);
    if (!sid) return;
    try {
      var r = await fetch('/api/chat/history?session_id=' + encodeURIComponent(sid));
      if (r.status === 404) {
        localStorage.removeItem(SESSION_KEY);
        return;
      }
      if (!r.ok) return;
      var j = await r.json();
      chat.innerHTML = '';
      (j.messages || []).forEach(function (m) {
        addBubble(m.role === 'user' ? 'user' : 'bot', m.content);
      });
      chat.scrollTop = chat.scrollHeight;
    } catch (err) {}
  }

  function startNewChat() {
    localStorage.removeItem(SESSION_KEY);
    chat.innerHTML = '';
    inp.focus();
  }

  function syncNoteFilterGraphHighlight() {
    var v = (filterNote && filterNote.value) ? filterNote.value.trim() : '';
    filterGraphNodeId = v ? resolveGraphNodeId(v) : null;
    applyNodeColors();
  }

  async function populateNoteFilter() {
    try {
      var r = await fetch('/api/vault/files');
      var j = await r.json();
      if (!j.files || !j.files.length) return;
      var sel = filterNote;
      var cur = sel.value;
      sel.innerHTML = '<option value="">(all notes)</option>';
      j.files.forEach(function (p) {
        var o = document.createElement('option');
        o.value = p;
        o.textContent = p.length > 48 ? p.slice(0, 46) + '…' : p;
        sel.appendChild(o);
      });
      if (cur && Array.prototype.some.call(sel.options, function (x) { return x.value === cur; })) {
        sel.value = cur;
      }
      syncNoteFilterGraphHighlight();
    } catch (e) {}
  }

  if (filterNote) {
    filterNote.addEventListener('change', syncNoteFilterGraphHighlight);
  }

  btnExportChat.onclick = async function () {
    var sid = localStorage.getItem(SESSION_KEY);
    if (!sid) {
      alert('No active session yet — send a message first.');
      return;
    }
    btnExportChat.disabled = true;
    try {
      var r = await fetch('/api/chat/export', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sid }),
      });
      var j = await r.json().catch(function () { return {}; });
      if (!r.ok) {
        alert(j.detail || r.statusText || 'Export failed');
        return;
      }
      alert('Saved to vault: ' + (j.vault_rel_path || '(ok)'));
      populateNoteFilter();
    } catch (e) {
      alert(String(e));
    } finally {
      btnExportChat.disabled = false;
    }
  };

  function fitGraphToContainer() {
    if (!graph3d || !graphRoot) return;
    var w = graphRoot.clientWidth;
    var h = graphRoot.clientHeight;
    if (w < 2 || h < 2) return;
    graph3d.width(w);
    graph3d.height(h);
  }

  function scheduleGraphResize() {
    if (graphResizeRafGlobal !== null) cancelAnimationFrame(graphResizeRafGlobal);
    graphResizeRafGlobal = requestAnimationFrame(function () {
      graphResizeRafGlobal = null;
      fitGraphToContainer();
    });
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function addBubble(role, text, extraHtml) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    if (extraHtml) wrap.innerHTML = extraHtml + escapeHtml(text);
    else wrap.textContent = text;
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap;
  }

  function linkDegrees(nodes, edges) {
    const deg = {};
    nodes.forEach(function (n) { deg[n.id] = 0; });
    edges.forEach(function (e) {
      if (deg[e.from] !== undefined) deg[e.from]++;
      if (deg[e.to] !== undefined) deg[e.to]++;
    });
    return deg;
  }

  function apiToGraphData(data) {
    const rawNodes = data.nodes || [];
    const rawEdges = data.edges || [];
    const deg = linkDegrees(rawNodes, rawEdges);
    const nodes = rawNodes.map(function (x) {
      const label =
        x.label.length > 42 ? x.label.slice(0, 40) + '...' : x.label;
      return {
        id: x.id,
        label: label,
        val: (deg[x.id] || 0) + 1,
      };
    });
    const links = rawEdges.map(function (x) {
      return { source: x.from, target: x.to };
    });
    return { nodes: nodes, links: links };
  }

  function applyNodeColors() {
    if (!graph3d) return;
    graph3d.nodeColor(function (n) {
      if (filterGraphNodeId && n.id === filterGraphNodeId) {
        return FILTER_NODE;
      }
      if (pulsingIds.has(n.id)) return pulsePhase ? PULSE : NODE;
      return NODE;
    });
  }

  function destroyGraphIfAny() {
    if (pulseTimer) {
      clearInterval(pulseTimer);
      pulseTimer = null;
    }
    pulsingIds.clear();
    pulsePhase = false;
    pendingPulseItems = null;
    if (graphResizeObserver) {
      graphResizeObserver.disconnect();
      graphResizeObserver = null;
    }
    graphRoot.innerHTML = '';
    graph3d = null;
    graphModel = null;
  }

  function initGraph(data) {
    if (!data.vault_configured) {
      graphHint.className = 'err';
      graphHint.textContent = data.message || 'Vault not configured.';
      return;
    }
    if (data.error === 'vault_not_found') {
      graphHint.className = 'err';
      graphHint.textContent = 'Vault missing: ' + (data.detail || '');
      return;
    }

    destroyGraphIfAny();

    const rawNodes = data.nodes || [];
    const rawEdges = data.edges || [];
    const n = rawNodes.length;
    const e = rawEdges.length;
    graphHint.className = '';
    graphHint.textContent =
      n === 0
        ? 'No notes in vault.'
        : n + ' notes, ' + e + ' links (3D). Drag to orbit, scroll to zoom. Click a sphere to set the note filter (red).';

    if (typeof ForceGraph3D !== 'function') {
      graphHint.className = 'err';
      graphHint.textContent = '3D graph library failed to load.';
      return;
    }

    if (n === 0) {
      graphModel = { nodes: [], links: [] };
      return;
    }

    graphModel = apiToGraphData(data);

    graph3d = ForceGraph3D()(graphRoot)
      .graphData(graphModel)
      .backgroundColor('#2b2d39')
      .nodeLabel(function (n) {
        return n.label + '\n' + n.id + ' · ' + (n.val - 1) + ' link(s)';
      })
      .nodeVal('val')
      .nodeOpacity(0.92)
      .nodeResolution(16)
      .linkColor(function () { return LINK; })
      .linkOpacity(0.55)
      .linkWidth(0.35)
      .linkDirectionalParticles(0)
      .enableNodeDrag(true)
      .showNavInfo(true)
      .cooldownTicks(120)
      .onNodeClick(function (node) {
        if (!node || node.id === undefined || node.id === null) return;
        if (filterNote) {
          filterNote.value = String(node.id);
          syncNoteFilterGraphHighlight();
        }
        graphHint.className = '';
        graphHint.textContent =
          'Note filter: ' +
          String(node.id) +
          ' (red). Ask in chat — retrieval uses this file only. Choose “(all notes)” to clear.';
      })
      .onEngineStop(function () {
        if (graph3d) graph3d.zoomToFit(400, 80);
      });

    applyNodeColors();
    syncNoteFilterGraphHighlight();

    scheduleGraphResize();
    requestAnimationFrame(function () {
      scheduleGraphResize();
      requestAnimationFrame(scheduleGraphResize);
    });

    if (typeof ResizeObserver !== 'undefined') {
      graphResizeObserver = new ResizeObserver(function () {
        scheduleGraphResize();
      });
      graphResizeObserver.observe(graphRoot);
    }
    if (!graphListenersAttached) {
      graphListenersAttached = true;
      window.addEventListener('resize', scheduleGraphResize, { passive: true });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) scheduleGraphResize();
      });
    }

    flushPendingPulse();
  }

  function normalizeVaultPath(p) {
    if (!p || typeof p !== 'string') return '';
    return p.replace(/\\/g, '/').trim();
  }

  function allGraphIds() {
    if (!graphModel || !graphModel.nodes) return [];
    return graphModel.nodes.map(function (n) { return n.id; });
  }

  function resolveGraphNodeId(rawPath) {
    const p = normalizeVaultPath(rawPath);
    if (!p) return null;
    const ids = allGraphIds();
    if (ids.indexOf(p) >= 0) return p;
    var low = p.toLowerCase();
    var i;
    for (i = 0; i < ids.length; i++) {
      if (ids[i].toLowerCase() === low) return ids[i];
    }
    var base = p.split('/').pop();
    var hits = [];
    for (i = 0; i < ids.length; i++) {
      if (ids[i].split('/').pop().toLowerCase() === base.toLowerCase()) hits.push(ids[i]);
    }
    if (hits.length === 1) return hits[0];
    return null;
  }

  function normalizeTitleForMatch(s) {
    if (!s || typeof s !== 'string') return '';
    return s.split(/\s*[—\-]\s*/)[0].trim().toLowerCase();
  }

  function resolveGraphNodeIdByLabel(label) {
    if (!graphModel || !graphModel.nodes || !label) return null;
    const target = normalizeTitleForMatch(label);
    if (!target) return null;
    var i;
    var n;
    var nl;
    for (i = 0; i < graphModel.nodes.length; i++) {
      n = graphModel.nodes[i];
      if (!n.label) continue;
      nl = normalizeTitleForMatch(n.label);
      if (nl === target) return n.id;
      if (nl.indexOf(target) === 0 || target.indexOf(nl) === 0) return n.id;
    }
    return null;
  }

  function graphIdsFromSources(items) {
    const ids = [];
    const seen = {};
    (items || []).forEach(function (it) {
      let id = resolveGraphNodeId(it.graph_id || it.vault_rel_path || it.source_file);
      if (!id && it.label) {
        id = resolveGraphNodeIdByLabel(it.label);
      }
      if (id && !seen[id]) {
        seen[id] = true;
        ids.push(id);
      }
    });
    return ids;
  }

  function flushPendingPulse() {
    if (!pendingPulseItems || !graphModel || !graphModel.nodes.length) return;
    const items = pendingPulseItems;
    pendingPulseItems = null;
    const ids = graphIdsFromSources(items);
    if (ids.length) pulseNodes(ids);
  }

  function schedulePulseFromSources(items) {
    pendingPulseItems = items;
    function attemptPulse() {
      if (!graphModel || !graphModel.nodes.length || !pendingPulseItems) return false;
      const ids = graphIdsFromSources(pendingPulseItems);
      if (!ids.length) return false;
      pulseNodes(ids);
      pendingPulseItems = null;
      return true;
    }
    if (attemptPulse()) return;
    [40, 150, 400, 1000, 2400].forEach(function (ms) {
      setTimeout(function () {
        attemptPulse();
      }, ms);
    });
  }

  function stopPulse() {
    if (pulseTimer) {
      clearInterval(pulseTimer);
      pulseTimer = null;
    }
    pulsingIds.clear();
    pulsePhase = false;
    applyNodeColors();
  }

  function pulseNodes(ids) {
    stopPulse();
    if (!graph3d || !ids.length) return;

    ids.forEach(function (id) { pulsingIds.add(id); });
    applyNodeColors();

    try {
      graph3d.zoomToFit(450, 72, function (n) { return pulsingIds.has(n.id); });
    } catch (e1) {
      try {
        graph3d.zoomToFit(450, 80);
      } catch (e2) {}
    }

    let step = 0;
    const maxSteps = 10;
    pulseTimer = setInterval(function () {
      pulsePhase = !pulsePhase;
      applyNodeColors();
      step++;
      if (step >= maxSteps) {
        clearInterval(pulseTimer);
        pulseTimer = null;
        pulsingIds.clear();
        pulsePhase = false;
        applyNodeColors();
      }
    }, 160);
  }

  async function streamAsk(q) {
    send.disabled = true;
    addBubble('user', q);
    const botWrap = document.createElement('div');
    botWrap.className = 'msg bot';
    const answerDiv = document.createElement('div');
    answerDiv.className = 'answer-body';
    const vaultEditHost = document.createElement('div');
    vaultEditHost.className = 'vault-edit-host';
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.textContent = 'Thinking...';
    botWrap.appendChild(typing);
    botWrap.appendChild(answerDiv);
    botWrap.appendChild(vaultEditHost);
    chat.appendChild(botWrap);
    let botText = '';

    try {
      const res = await fetch('/api/rag/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: q,
          show_sources: showSources.checked,
          session_id: localStorage.getItem(SESSION_KEY),
          filter_note: (filterNote && filterNote.value) ? filterNote.value : null,
          filter_tag: (filterTag && filterTag.value.trim()) ? filterTag.value.trim() : null,
          expand_wikilinks: expandWikilinks ? expandWikilinks.checked : true,
          suggest_vault_edit: suggestEdit ? suggestEdit.checked : false,
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        typing.remove();
        let msg = res.statusText;
        if (err.detail) {
          msg = Array.isArray(err.detail)
            ? err.detail.map((x) => x.msg || JSON.stringify(x)).join(' ')
            : String(err.detail);
        }
        answerDiv.innerHTML = '<span class="err">' + escapeHtml(msg) + '</span>';
        return;
      }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buffer = '';
      typing.textContent = 'Streaming...';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += dec.decode(value, { stream: true });
        const blocks = buffer.split('\n\n');
        buffer = blocks.pop() || '';
        for (const block of blocks) {
          if (!block.startsWith('data: ')) continue;
          let data;
          try {
            data = JSON.parse(block.slice(6));
          } catch (e) {
            continue;
          }
          if (data.type === 'meta' && data.session_id) {
            try {
              localStorage.setItem(SESSION_KEY, data.session_id);
            } catch (e1) {}
          }
          if (data.type === 'sources' && data.items) {
            if (showSources.checked) {
              const lines = data.items.map(function (it) {
                var bits = ['* ' + (it.source_file || '?')];
                if (it.distance !== undefined && it.distance !== null) {
                  bits.push('dist:' + Number(it.distance).toFixed(4));
                }
                if (it.context_expand) bits.push('[' + it.context_expand + ']');
                bits.push('- ' + (it.label || '').slice(0, 72));
                var line = bits.join(' ');
                if (it.obsidian_uri) {
                  line += '\n  ' + it.obsidian_uri;
                }
                if (it.match_hint && it.distance !== undefined) {
                  line += '\n  (' + it.match_hint + ')';
                }
                return line;
              });
              const div = document.createElement('div');
              div.className = 'sources';
              div.textContent = 'Sources:\n' + lines.join('\n');
              botWrap.insertBefore(div, typing);
            }
            schedulePulseFromSources(data.items);
          }
          if (data.type === 'vault_edit') {
            vaultEditHost.innerHTML = '';
            var panel = document.createElement('div');
            panel.className = 'vault-edit-panel';
            var pathEl = document.createElement('div');
            pathEl.innerHTML = '<strong>Suggested patch</strong> → <code>' + escapeHtml(data.path || '') + '</code>';
            var pre = document.createElement('pre');
            pre.textContent = data.markdown || '';
            var btnCopy = document.createElement('button');
            btnCopy.type = 'button';
            btnCopy.textContent = 'Copy markdown';
            btnCopy.style.marginTop = '0.35rem';
            btnCopy.onclick = function () {
              navigator.clipboard.writeText(data.markdown || '').catch(function () {});
            };
            panel.appendChild(pathEl);
            panel.appendChild(pre);
            panel.appendChild(btnCopy);
            vaultEditHost.appendChild(panel);
          }
          if (data.type === 'token' && data.text) {
            botText += data.text;
            typing.remove();
            answerDiv.textContent = botText;
          }
          if (data.type === 'error') {
            typing.remove();
            answerDiv.innerHTML = '<span class="err">' + escapeHtml(data.detail || 'Error') + '</span>';
          }
          if (data.type === 'done') typing.remove();
        }
      }
      typing.remove();
      if (!botText && !answerDiv.querySelector('.err')) {
        answerDiv.textContent = '(empty reply)';
      }
    } catch (e) {
      typing.remove();
      answerDiv.innerHTML = '<span class="err">' + escapeHtml(String(e)) + '</span>';
    } finally {
      send.disabled = false;
      inp.focus();
    }
  }

  send.onclick = function () {
    const q = inp.value.trim();
    if (!q) return;
    inp.value = '';
    streamAsk(q);
  };
  inp.onkeydown = function (e) {
    if (e.key === 'Enter') send.click();
  };

  function setReindexStatus(text, cls) {
    reindexStatus.textContent = text || '';
    reindexStatus.className = 'tool-status' + (cls ? ' ' + cls : '');
  }

  async function refreshVaultFilePanel() {
    vaultFilesList.innerHTML = '';
    vaultFilesMeta.textContent = 'Loading...';
    try {
      const r = await fetch('/api/vault/files');
      const j = await r.json();
      if (!j.vault_configured) {
        vaultFilesMeta.textContent = j.message || 'Vault not configured.';
        return;
      }
      if (j.error === 'vault_not_found') {
        vaultFilesMeta.textContent = 'Vault missing: ' + (j.detail || '');
        return;
      }
      vaultFilesMeta.textContent = j.count + ' file(s) · ' + (j.vault_root || '');
      (j.files || []).forEach(function (p) {
        var li = document.createElement('li');
        li.textContent = p;
        vaultFilesList.appendChild(li);
      });
    } catch (err) {
      vaultFilesMeta.textContent = String(err);
    }
  }

  btnNewChat.onclick = function () {
    startNewChat();
  };

  btnVaultToggle.onclick = function () {
    var collapsed = vaultFilesPanel.classList.toggle('is-collapsed');
    btnVaultToggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    if (!collapsed) refreshVaultFilePanel();
  };

  btnUploadMd.onclick = function () {
    vaultFileInput.click();
  };

  vaultFileInput.onchange = async function () {
    if (!vaultFileInput.files.length) return;
    var fd = new FormData();
    for (var i = 0; i < vaultFileInput.files.length; i++) {
      fd.append('files', vaultFileInput.files[i]);
    }
    setReindexStatus('Uploading...', 'run');
    try {
      var res = await fetch('/api/vault/upload', { method: 'POST', body: fd });
      var j = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        var detail = j.detail;
        if (typeof detail !== 'string') detail = JSON.stringify(detail || res.statusText);
        setReindexStatus(detail, 'err');
        return;
      }
      var skipped = (j.skipped && j.skipped.length)
        ? ' Skipped: ' + j.skipped.join(', ') + '.'
        : '';
      setReindexStatus(
        'Saved ' + (j.saved_count || 0) + ' file(s).' + skipped + ' Click Reindex to update search.',
        'ok'
      );
      if (!vaultFilesPanel.classList.contains('is-collapsed')) refreshVaultFilePanel();
    } catch (err) {
      setReindexStatus(String(err), 'err');
    }
    vaultFileInput.value = '';
  };

  btnReindex.onclick = async function () {
    btnReindex.disabled = true;
    setReindexStatus('Reindexing...', 'run');
    try {
      var res = await fetch('/api/vault/reindex', { method: 'POST' });
      var j = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        var detail = j.detail;
        if (typeof detail !== 'string') detail = JSON.stringify(detail || res.statusText);
        setReindexStatus(detail, 'err');
        return;
      }
      setReindexStatus(
        'Indexed ' +
          j.chunks_indexed +
          ' chunks from ' +
          j.files_indexed +
          ' files · ' +
          (j.indexed_at || '') +
          ' — OK',
        'ok'
      );
      fetch('/api/vault/graph')
        .then(function (r) {
          return r.json();
        })
        .then(initGraph)
        .catch(function (err) {
          graphHint.className = 'err';
          graphHint.textContent = String(err);
        });
      if (!vaultFilesPanel.classList.contains('is-collapsed')) refreshVaultFilePanel();
    } catch (err) {
      setReindexStatus(String(err), 'err');
    } finally {
      btnReindex.disabled = false;
    }
  };

  loadPersistedChat();
  populateNoteFilter();

  fetch('/api/rag/health')
    .then(function (r) {
      return r.json();
    })
    .then(function (j) {
      if (!j.ok && j.startup_error) {
        const d = document.createElement('div');
        d.className = 'err';
        d.style.padding = '0.75rem';
        d.textContent = 'Server issue: ' + j.startup_error;
        chat.appendChild(d);
      }
    })
    .catch(function () {});

  fetch('/api/vault/graph')
    .then(function (r) {
      return r.json();
    })
    .then(initGraph)
    .catch(function (err) {
      graphHint.className = 'err';
      graphHint.textContent = String(err);
    });
})();
  </script>
</body>
</html>
